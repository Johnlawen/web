<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucca Groove – Scanner Ingressi</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: var(--black);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: 'Barlow', sans-serif;
    }
    .scanner-container {
      width: 100%;
      max-width: 500px;
      background: var(--black-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255,107,0,0.1);
    }
    .scanner-header {
      margin-bottom: 2rem;
    }
    .scanner-logo {
      width: 60px;
      margin: 0 auto 1rem;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #qr-reader {
      width: 100%;
      border: 2px solid var(--orange);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #scan-result {
      margin-top: 1.5rem;
      display: none;
      padding: 1.5rem;
      border-radius: 8px;
      animation: fadeIn 0.3s ease;
    }
    #scan-status {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    #scan-details {
      font-size: 1.1rem;
      line-height: 1.5;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="scanner-container">
    <div class="scanner-header">
      <img src="logo-ready.png" alt="Lucca Groove" class="scanner-logo" />
      <h1>Scanner Ingressi</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Seleziona l'evento e scansiona il biglietto.</p>
      
      <div style="margin-top: 1.5rem;">
        <select id="event-selector" style="width: 100%; padding: 0.8rem; background: #000; border: 1px solid var(--orange); color: #fff; border-radius: 8px; font-size: 1.1rem; font-family: 'Barlow Condensed', sans-serif;">
          <option value="">-- Caricamento eventi... --</option>
        </select>
      </div>
    </div>

    <div id="qr-reader" style="display:none;"></div>
    
    <div id="scan-result">
      <h3 id="scan-status"></h3>
      <p id="scan-details"></p>
      <button class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;" onclick="resetScanner()">Scansiona un altro biglietto</button>
    </div>
    
    <div style="margin-top: 2rem;">
      <a href="index.html" style="color: var(--text-muted); font-size: 0.8rem; text-decoration: underline;">← Torna al sito principale</a>
    </div>
  </div>

  <script>
    let html5QrCode;
    let selectedEvent = "";
    let isProcessing = false; // Lock to prevent duplicate scans

    async function fetchEvents() {
      try {
        const res = await fetch('/api/get-data');
        const data = await res.json();
        const select = document.getElementById('event-selector');
        
        select.innerHTML = '<option value="">-- Seleziona Evento --</option>';
        if (data.events && data.events.length > 0) {
          data.events.filter(e => e.active).forEach(ev => {
            select.innerHTML += `<option value="${ev.name}">${ev.name}</option>`;
          });
        }
        
        select.addEventListener('change', (e) => {
          selectedEvent = e.target.value;
          if (selectedEvent) {
            document.getElementById('qr-reader').style.display = 'block';
            initScanner();
          } else {
            document.getElementById('qr-reader').style.display = 'none';
            if (html5QrCode) {
              try { html5QrCode.stop(); } catch(err) {}
            }
          }
        });
      } catch (e) {
        console.error(e);
        document.getElementById('event-selector').innerHTML = '<option value="">Errore di rete</option>';
      }
    }

    function initScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      } else {
        // If it's already running, don't start again
        if (html5QrCode.isScanning) return;
      }
      
      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        console.error("Camera error:", err);
        document.getElementById('qr-reader').innerHTML = '<p style="color:red;padding:20px;">Impossibile accedere alla fotocamera. Assicurati di aver concesso i permessi.</p>';
        document.getElementById('qr-reader').style.display = 'block';
      });
    }

    async function onScanSuccess(decodedText, decodedResult) {
      // Prevent duplicate scan events from firing while processing
      if (isProcessing) return;
      isProcessing = true;

      // Require event to be selected
      if (!selectedEvent) {
        isProcessing = false;
        alert('Seleziona prima un evento dalla lista!');
        return;
      }

      // Stop camera immediately
      try { await html5QrCode.stop(); } catch(e) {}
      
      const orderId = decodedText;
      const scanResult = document.getElementById('scan-result');
      const scanStatus = document.getElementById('scan-status');
      const scanDetails = document.getElementById('scan-details');
      
      scanResult.style.display = 'block';
      document.getElementById('qr-reader').style.display = 'none';
      scanStatus.textContent = "⏳ VERIFICA IN CORSO...";
      scanStatus.style.color = "#888";
      scanDetails.textContent = "Attendi...";
      scanResult.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
      scanResult.style.border = '1px solid #333';

      try {
        const res = await fetch('/api/save-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'scan', orderId, eventName: selectedEvent })
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
          const order = data.order;
          const isUnpaid = order.status === 'Da Pagare' || order.status === 'To Pay' || order.payment === 'Da Pagare' || order.payment === 'To Pay' || order.payment === 'To Be Paid' || order.status === 'To Be Paid';
          
          if (isUnpaid) {
            scanResult.style.backgroundColor = 'rgba(255, 170, 0, 0.15)';
            scanResult.style.border = '1px solid #ffaa00';
            scanStatus.textContent = "⚠️ DA PAGARE IN CASSA";
            scanStatus.style.color = "#ffaa00";
            scanDetails.innerHTML = `
              <strong>DA RISCUOTERE:</strong> <span style="color:#ffaa00; font-size:1.5rem; font-weight:bold;">€${order.total || 0}</span><br/><br/>
              <strong>Ordine:</strong> ${order.id}<br/>
              <strong>Nome:</strong> ${order.name}<br/>
              <strong>Tipo:</strong> ${order.round}<br/>
              <strong>Rimanenti:</strong> ${order.qty - order.used} di ${order.qty}
            `;
          } else {
            scanResult.style.backgroundColor = 'rgba(0, 255, 0, 0.15)';
            scanResult.style.border = '1px solid #44ff44';
            scanStatus.textContent = "✅ CONSENTITO";
            scanStatus.style.color = "#44ff44";
            scanDetails.innerHTML = `
              <strong>Ordine:</strong> ${order.id}<br/>
              <strong>Nome:</strong> ${order.name}<br/>
              <strong>Tipo:</strong> ${order.round}<br/>
              <strong>Rimanenti:</strong> ${order.qty - order.used} di ${order.qty}
            `;
          }
        } else if (res.status === 400 && data.order) {
          const order = data.order;
          if (data.rejected) {
            // Hard rejection: refunded, wrong event — clearly denied
            scanResult.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
            scanResult.style.border = '2px solid #ff4444';
            scanStatus.textContent = "🚫 RIFIUTATO";
            scanStatus.style.color = "#ff4444";
            scanDetails.innerHTML = `
              <strong style="color:#ff4444">${data.error}</strong><br/><br/>
              <strong>Nome:</strong> ${order.name}<br/>
              <strong>Ordine:</strong> ${order.id}
            `;
          } else {
            // Soft warning: already used
            scanResult.style.backgroundColor = 'rgba(255, 170, 0, 0.15)';
            scanResult.style.border = '1px solid #ffaa00';
            scanStatus.textContent = "⚠️ GIÀ UTILIZZATO";
            scanStatus.style.color = "#ffaa00";
            scanDetails.innerHTML = `
              <strong>Errore:</strong> ${data.error}<br/><br/>
              <strong>Ordine:</strong> ${order.id}<br/>
              <strong>Nome:</strong> ${order.name}<br/>
              <strong>Ingressi Usati:</strong> ${order.used} su ${order.qty}
            `;
          }
        } else {
          scanResult.style.backgroundColor = 'rgba(255, 0, 0, 0.15)';
          scanResult.style.border = '1px solid #ff4444';
          scanStatus.textContent = "❌ BIGLIETTO NON VALIDO";
          scanStatus.style.color = "#ff4444";
          scanDetails.textContent = data.error || `Nessun ordine trovato per l'ID: ${orderId}`;
        }
      } catch (err) {
        scanResult.style.backgroundColor = 'rgba(255, 0, 0, 0.15)';
        scanResult.style.border = '1px solid #ff4444';
        scanStatus.textContent = "❌ ERRORE DI RETE";
        scanStatus.style.color = "#ff4444";
        scanDetails.textContent = "Impossibile contattare il server. Riprova.";
      } finally {
        // Lock stays on — user must press the button to scan next ticket
        // isProcessing is reset by resetScanner()
      }
    }

    function onScanFailure(error) {
      // Ignore background errors
    }

    function resetScanner() {
      isProcessing = false; // Release the lock so next scan works
      document.getElementById('scan-result').style.display = 'none';
      document.getElementById('qr-reader').style.display = 'block';
      initScanner();
    }

    // Start on load
    window.onload = () => {
      fetchEvents();
    };
  </script>
</body>
</html>
